services:
  postgres:
    image: postgres:17
    container_name: shipyard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shipyard
      POSTGRES_USER: ${DB_USERNAME:-shipyard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shipyard_dev}
      TZ: Asia/Kolkata
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shipyard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: